<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3730a3"><title>ইন্টারনেট সংযোগ প্রয়োজন • বাসা হিসাব</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5f6fc;color:#18224a;font:18px/1.9 system-ui;padding:24px}main{max-width:440px;text-align:center;background:white;padding:40px 26px;border-radius:28px;box-shadow:0 20px 80px #24215c12}img{width:88px;border-radius:24px}h1{font-size:26px}p{color:#60677e}a{display:block;padding:14px;background:#3730a3;border-radius:14px;color:white;text-decoration:none}</style><main><img src="/icons/icon-192.png" alt=""><h1>আবার সংযোগ হলেই দেখা হবে</h1><p>বাসা হিসাব ব্যবহার করতে ইন্টারনেট চালু করুন। বিল তৈরি, পেমেন্ট এবং আর্থিক হিসাবের জন্য ইন্টারনেট সংযোগ প্রয়োজন।</p><p>আপনার ব্যক্তিগত হিসাব এই ডিভাইসে অফলাইনে সংরক্ষণ করা হয় না।</p><a href="/dashboard">আবার চেষ্টা করুন</a></main></html>
